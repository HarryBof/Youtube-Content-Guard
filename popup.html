<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      width: 300px;
      margin: 0;
      padding: 12px;
      background: #141414;
      color: #eee;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;
    }

    input[type="text"],
    input[type="password"] {
      background: #222;
      border: 1px solid #333;
      color: #fff;
      padding: 8px 10px;
      border-radius: 6px;
      outline: none;
      font-size: 13px;
      width: 100%;
    }

    input:focus {
      border-color: #2ba640;
    }

    input:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    /* =========================
       SETUP
       ========================= */

    #setup-view {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-save-setup {
      background: #2ba640;
      border: none;
      color: white;
      padding: 8px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-save-setup:hover {
      background: #238636;
    }

    /* =========================
       MAIN
       ========================= */

    #main-view {
      display: none;
    }

    .input-row {
      display: flex;
      gap: 6px;
    }

    .input-row input {
      flex: 1;
      min-width: 0;
    }

    .btn-add {
      width: 35px;
      height: 35px;
      min-width: 35px;
      background: #2ba640;
      border: none;
      color: white;
      font-size: 20px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-add:hover {
      background: #238636;
    }

    .btn-add:disabled {
      background: #555;
      cursor: not-allowed;
    }

    /* =========================
       ADMIN PANEL
       ========================= */

    #admin-panel {
      margin-top: 14px;
      border-top: 1px solid #2d2d2d;
      padding-top: 10px;
    }

    .panel-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .panel-top span {
      font-size: 12px;
      font-weight: bold;
      color: #888;
    }

    .btn-clear-all {
      background: none;
      border: none;
      color: #ff4d4f;
      font-size: 11px;
      cursor: pointer;
      padding: 0;
    }

    .btn-clear-all:hover {
      text-decoration: underline;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0 0 12px 0;
      max-height: 160px;
      overflow-y: auto;
    }

    li {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid #222;

      font-size: 12px;
      line-height: 1.4;
      color: #ccc;
    }

    .btn-remove {
      width: 18px;
      height: 18px;
      min-width: 18px;

      background: #ff4d4f;
      border: none;
      color: white;

      font-size: 13px;
      border-radius: 3px;
      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-top: 2px;
    }

    .btn-remove:hover {
      background: #d9363e;
    }

    .item-text {
      flex: 1;
      word-break: break-word;
    }

    /* =========================
       API KEY
       ========================= */

    .api-box {
      margin-top: 8px;
      border-top: 1px dashed #333;
      padding-top: 8px;

      display: flex;
      gap: 6px;
    }

    .api-box input {
      min-width: 0;
    }

    .btn-update-key {
      background: #333;
      border: none;
      color: #ddd;

      padding: 0 10px;
      border-radius: 6px;

      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-update-key:hover {
      background: #444;
    }
  </style>
</head>

<body>

  <!-- =========================
       1. SETUP LẦN ĐẦU
       ========================= -->

  <div id="setup-view">

    <input
      type="password"
      id="init-api-key"
      placeholder="Nhập Gemini API Key..."
      autocomplete="off"
    />

    <input
      type="password"
      id="init-password"
      placeholder="Tạo mật khẩu mở khóa..."
      autocomplete="new-password"
    />

    <button
      class="btn-save-setup"
      id="btn-save-setup"
    >
      Lưu thiết lập
    </button>

  </div>


  <!-- =========================
       2. MAIN VIEW
       ========================= -->

  <div id="main-view">

    <div class="input-row">

      <input
        type="text"
        id="rule-input"
        placeholder="Input text or link..."
        autofocus
        autocomplete="off"
      />

      <button
        class="btn-add"
        id="btn-add"
        title="Thêm"
      >
        +
      </button>

    </div>


    <!-- =========================
         3. ADMIN PANEL
         ========================= -->

    <div
      id="admin-panel"
      style="display: none;"
    >

      <div class="panel-top">

        <span>
          Block list
        </span>

        <button
          class="btn-clear-all"
          id="btn-clear-all"
        >
          Delete all
        </button>

      </div>


      <ul id="rules-list"></ul>


      <!-- =========================
           ĐỔI API KEY
           ========================= -->

      <div class="api-box">

        <input
          type="password"
          id="change-api-key"
          placeholder="Change API Key..."
          autocomplete="off"
        />

        <button
          class="btn-update-key"
          id="btn-update-key"
        >
          Update
        </button>

      </div>

    </div>

  </div>


  <script src="popup.js"></script>

</body>
</html>
