<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      width: 330px;
      margin: 0;
      padding: 12px;
      background: #141414;
      color: #eee;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;
    }

    input[type="text"],
    input[type="password"] {
      background: #222;
      border: 1px solid #333;
      color: #fff;
      padding: 8px 10px;
      border-radius: 6px;
      outline: none;
      font-size: 13px;
      width: 100%;
    }

    input:focus {
      border-color: #2ba640;
    }

    /* =========================
       INITIAL SETUP
       ========================= */

    #setup-view {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .setup-note {
      font-size: 11px;
      color: #888;
      line-height: 1.4;
    }

    .btn-save-setup {
      background: #2ba640;
      border: none;
      color: white;
      padding: 8px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-save-setup:hover {
      background: #238636;
    }

    /* =========================
       MAIN VIEW
       ========================= */

    #main-view {
      display: none;
    }

    .input-row {
      display: flex;
      gap: 6px;
    }

    .input-row input {
      flex: 1;
      min-width: 0;
    }

    .btn-add {
      width: 35px;
      height: 35px;
      min-width: 35px;
      background: #2ba640;
      border: none;
      color: white;
      font-size: 20px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-add:hover {
      background: #238636;
    }

    .btn-add:disabled {
      background: #555;
      cursor: not-allowed;
    }

    /* =========================
       ADMIN PANEL
       ========================= */

    #admin-panel {
      margin-top: 14px;
      border-top: 1px solid #2d2d2d;
      padding-top: 10px;
    }

    .panel-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .panel-top span {
      font-size: 12px;
      font-weight: bold;
      color: #888;
    }

    .btn-clear-all {
      background: none;
      border: none;
      color: #ff4d4f;
      font-size: 11px;
      cursor: pointer;
      padding: 0;
    }

    .btn-clear-all:hover {
      text-decoration: underline;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0 0 12px 0;
      max-height: 160px;
      overflow-y: auto;
    }

    li {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid #222;

      font-size: 12px;
      line-height: 1.4;
      color: #ccc;
    }

    .btn-remove {
      width: 18px;
      height: 18px;
      min-width: 18px;

      background: #ff4d4f;
      border: none;
      color: white;

      font-size: 13px;
      border-radius: 3px;
      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-top: 2px;
    }

    .btn-remove:hover {
      background: #d9363e;
    }

    .item-text {
      flex: 1;
      word-break: break-word;
    }

    /* =========================
       AI SETTINGS
       ========================= */

    .ai-section {
      margin-top: 10px;
      border-top: 1px dashed #333;
      padding-top: 10px;
    }

    .ai-title {
      font-size: 12px;
      font-weight: bold;
      color: #888;
      margin-bottom: 8px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .toggle-label {
      font-size: 12px;
      color: #ccc;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 20px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #444;
      border-radius: 20px;
      transition: 0.2s;
    }

    .slider:before {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      left: 2px;
      top: 2px;
      background: white;
      border-radius: 50%;
      transition: 0.2s;
    }

    .switch input:checked + .slider {
      background: #2ba640;
    }

    .switch input:checked + .slider:before {
      transform: translateX(18px);
    }

    /* =========================
       CURRENT API KEY
       ========================= */

    .current-api-row {
      display: flex;
      gap: 5px;
      margin-bottom: 6px;
    }

    #current-api-key {
      flex: 1;
      min-width: 0;
      color: #aaa;
    }

    .btn-show-api {
      background: #333;
      border: none;
      color: #ddd;
      padding: 0 9px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
    }

    .btn-show-api:hover {
      background: #444;
    }

    .api-update-row {
      display: flex;
      gap: 6px;
    }

    .api-update-row input {
      min-width: 0;
    }

    .btn-update-key {
      background: #333;
      border: none;
      color: #ddd;
      padding: 0 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-update-key:hover {
      background: #444;
    }

    .api-note {
      font-size: 10px;
      color: #666;
      line-height: 1.35;
      margin-top: 6px;
    }
  </style>

</head>

<body>

  <!-- =========================
       INITIAL SETUP
       ========================= -->

  <div id="setup-view">


<input
  type="password"
  id="init-api-key"
  placeholder="Gemini API Key (optional)"
  autocomplete="off"
/>

<input
  type="password"
  id="init-password"
  placeholder="Password"
  autocomplete="new-password"
/>

<div class="setup-note">
  API key is optional. If provided, it will be used for
  AI content moderation when no local match is found. You
  can also set it later in the admin panel.
</div>

<button
  class="btn-save-setup"
  id="btn-save-setup"
>
  Save
</button>


  </div>

  <!-- =========================
       MAIN VIEW
       ========================= -->

  <div id="main-view">


<div class="input-row">

  <input
    type="text"
    id="rule-input"
    placeholder="Input text or link..."
    autofocus
    autocomplete="off"
  />

  <button
    class="btn-add"
    id="btn-add"
    title="Add"
  >
    +
  </button>

</div>

<!-- =========================
     ADMIN PANEL
     ========================= -->

<div
  id="admin-panel"
  style="display: none;"
>

  <div class="panel-top">

    <span>
      Block list
    </span>

    <button
      class="btn-clear-all"
      id="btn-clear-all"
    >
      Delete all
    </button>

  </div>

  <ul id="rules-list"></ul>

  <!-- =========================
       AI SETTINGS
       ========================= -->

  <div class="ai-section">

    <div class="ai-title">
      AI Settings
    </div>

    <div class="toggle-row">

      <span class="toggle-label">
        Toggle AI moderation
      </span>

      <label class="switch">

        <input
          type="checkbox"
          id="use-api-toggle"
        >

        <span class="slider"></span>

      </label>

    </div>

    <!-- CURRENT API KEY -->

    <div class="current-api-row">

      <input
        type="text"
        id="current-api-key"
        readonly
        value="Not configured"
      >

      <button
        class="btn-show-api"
        id="btn-show-api"
      >
        Show
      </button>

    </div>

    <!-- UPDATE API KEY -->

    <div class="api-update-row">

      <input
        type="password"
        id="change-api-key"
        placeholder="New Gemini API Key..."
        autocomplete="off"
      >

      <button
        class="btn-update-key"
        id="btn-update-key"
      >
        Update
      </button>

    </div>

    <div class="api-note">
      AI is only called when title, channel and description
      do not directly match any block rule.
    </div>

  </div>

</div>


  </div>

  <script src="popup.js"></script>

</body>
</html>
